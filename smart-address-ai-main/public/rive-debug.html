<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rive debug (no React)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #1a1f2e;
        color: #e8ecf4;
      }
      #canvas-wrap {
        width: min(900px, 100%);
        height: 420px;
        border: 2px solid #3b82f6;
        border-radius: 12px;
        background: #2a3142;
        overflow: hidden;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      pre {
        margin-top: 1rem;
        padding: 1rem;
        background: #111827;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Rive debug (standalone)</h1>
    <p>If this page shows the animation, the <code>.riv</code> file is fine and the issue is in the React app.</p>
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <pre id="log">Loading…</pre>
    <script src="https://unpkg.com/@rive-app/canvas@2.38.0/rive.js"></script>
    <script>
      const logEl = document.getElementById("log");
      const lines = [];
      function log(msg) {
        lines.push(msg);
        logEl.textContent = lines.join("\n");
      }

      const canvas = document.getElementById("canvas");
      const src = "/animations/smartaddress-approved.riv";

      try {
        const r = new rive.Rive({
          src,
          canvas,
          artboard: "Animation",
          stateMachines: "State Machine 1",
          autoplay: true,
          onLoad: () => {
            r.resizeDrawingSurfaceToCanvas();
            log("onLoad OK");
            log("Active artboard: " + r.activeArtboard);
            log("State machines: " + JSON.stringify(r.stateMachineNames));
            log("Animations: " + JSON.stringify(r.animationNames));
            log("Playing: " + r.isPlaying);
          },
          onLoadError: (err) => {
            log("onLoadError: " + (err?.data || JSON.stringify(err)));
          },
        });
      } catch (e) {
        log("Constructor error: " + e.message);
      }
    </script>
  </body>
</html>
