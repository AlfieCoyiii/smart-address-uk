{% extends 'parser/base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:75vh;">
  <div class="card shadow-sm p-4" style="min-width:350px;max-width:420px;border-radius:14px;">
    <h4 class="mb-3" style="color:#26547C;font-weight:600;">Set a new password</h4>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3">{{ form.password1.label_tag }}<input type="password" name="password1" class="login-modern-input" placeholder="Enter new password" required></div>
      <div class="mb-3">{{ form.password2.label_tag }}<input type="password" name="password2" class="login-modern-input" placeholder="Repeat new password" required></div>
      <button type="submit" class="btn btn-primary-modern w-100 mb-2" style="background-color:#6BE177;border:none;font-weight:600;">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
