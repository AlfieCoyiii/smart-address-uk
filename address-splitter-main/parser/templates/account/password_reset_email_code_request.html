{% extends 'parser/base.html' %}
{% block content %}
<div class="container" style="max-width:430px;margin:48px auto 0 auto;">
  <div class="card shadow-sm p-4" style="border-radius:14px;">
    <h4 class="mb-3" style="color:#26547C;font-weight:600;">Reset your password</h4>
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <input type="email" id="email" name="email" placeholder="Your email address" maxlength="254" required value="{{ form.email.value|default_if_none:'' }}" class="login-modern-input">
      </div>
      <button type="submit" class="btn btn-primary-modern w-100 mb-2" style="background-color:#6BE177;border:none;font-weight:600;">Send Reset Code</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_head %}
<style>
.login-modern-input {
  border: none;
  border-radius: 0;
  background: transparent;
  border-bottom: 2px solid #cfd8dc;
  padding: 0.62em 0 .35em 0;
  font-size: 1.13em;
  width: 100%;
  transition: border-color 0.2s;
  font-family: 'Poppins', Arial, sans-serif;
  margin-bottom: 0;
  outline: none;
  box-shadow: none;
}
.login-modern-input:focus {
  border-color: #6BE177;
  background: transparent;
  box-shadow: none;
}
</style>
{% endblock %}
