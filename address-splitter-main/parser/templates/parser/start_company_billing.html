{% extends 'parser/base.html' %}
{% block title %}Company Sign Up | UK Address Splitter{% endblock %}
{% block content %}
<div class="container" style="max-width:430px;margin:4em auto;">
  <div class="card shadow" style="border-radius:14px;">
    <div class="card-body p-4">
      <h2 class="mb-4 text-center" style="font-weight:700;">Company Sign Up</h2>
      <form id="billing-role-form" method="post" action="">
        {% csrf_token %}
        <div class="mb-4 text-center" style="font-size:1.09em;">
          Would you like to set up payments on behalf of your company?
        </div>
        <div class="d-flex justify-content-center gap-3 mb-2">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="billing_role" id="role_self" value="self" checked>
            <label class="form-check-label" for="role_self" style="font-weight:600;">Yes, I will</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="billing_role" id="role_other" value="other">
            <label class="form-check-label" for="role_other" style="font-weight:600;">No, someone else will</label>
          </div>
        </div>
        <div id="other-email-block" class="mb-3" style="display:none;">
          <input type="email" name="other_email" id="id_other_email" class="form-control login-modern-input" placeholder="Billing admin's email address">
        </div>
        <div id="company-name-block" class="mb-3">
          <input type="text" name="company_name" id="id_company_name" class="form-control login-modern-input" placeholder="Company name">
        </div>
        <div class="d-grid">
          <button type="submit" id="company-start-continue" class="btn btn-success mt-2" style="background:#6BE177; border:none; font-weight:600; font-size:1.09em;">Continue</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const selfRadio = document.getElementById('role_self');
  const otherRadio = document.getElementById('role_other');
  const emailBlock = document.getElementById('other-email-block');
  const nameBlock = document.getElementById('company-name-block');
  const form = document.getElementById('billing-role-form');
  function toggleBlocks() {
    if (otherRadio.checked) {
      emailBlock.style.display = '';
      nameBlock.style.display = 'none';
    } else {
      nameBlock.style.display = '';
      emailBlock.style.display = 'none';
    }
  }
  selfRadio.addEventListener('change', toggleBlocks);
  otherRadio.addEventListener('change', toggleBlocks);
  toggleBlocks();
});
</script>
{% endblock %}
