{% extends 'parser/base.html' %}
{% block title %}Password Reset Complete | UK Address Splitter{% endblock %}
{% block content %}
<div class="container" style="max-width:430px;margin:4em auto;">
  <div class="card shadow" style="border-radius:14px;">
    <div class="card-body p-4 text-center">
      <h2 class="mb-4">Password Changed</h2>
      <p>Your password has been successfully changed.</p>
      <a href="{% url 'account_login' %}" class="btn btn-primary-modern px-4 mt-3">Go to Login</a>
    </div>
  </div>
</div>
{% endblock %}
