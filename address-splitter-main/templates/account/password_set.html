{% extends 'parser/base.html' %}
{% block title %}Set Password | UK Address Splitter{% endblock %}
{% block content %}
<div class="container" style="max-width:430px;margin:4em auto;">
  <div class="card shadow" style="border-radius:14px;">
    <div class="card-body p-4">
      <h2 class="mb-4 text-center">Set Your Password</h2>
      <form method="post" action="">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label for="id_{{ field.name }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary-modern w-100 mb-2">Set Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
